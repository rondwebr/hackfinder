<body>
<main>
  <button id="theme" aria-label="Alternar tema">Auto</button>
<h1><a href="/"><span class="logo" role="img" aria-label="Hackfinder logo"></span>Hackfinder</a></h1>
<p class="tag">Global online hackathons — filter by place, theme, prize money, and open registration. Live data from Devpost, refreshed automatically.</p>

<noscript><p>This directory needs JavaScript for filtering. A plain list of the newest hackathons follows:</p><ul id="noscript-list"></ul></noscript>

<div class="bar">
  <input id="q" type="search" placeholder="Search hackathons, organizers…" aria-label="Search">
  <div class="combo"><input id="loc" type="search" placeholder="Any location" autocomplete="off" aria-label="Location"><ul class="combo-list" id="loc-list" hidden></ul></div>
  <div class="combo"><input id="theme" type="search" placeholder="Any theme" autocomplete="off" aria-label="Theme"><ul class="combo-list" id="theme-list" hidden></ul></div>
  <select id="prize" aria-label="Minimum prize">
    <option value="">Any prize</option><option value="0">Cash prize offered</option>
    <option value="1000">$1k+</option><option value="10000">$10k+</option>
    <option value="50000">$50k+</option><option value="100000">$100k+</option>
  </select>
  <select id="state" aria-label="Registration status">
    <option value="">All</option><option value="upcoming">Accepting registrations</option><option value="ongoing">Happening now</option>
  </select>
  <select id="format" aria-label="Format">
    <option value="">Any format</option><option value="online">Online</option>
    <option value="inperson">In person</option><option value="hybrid">Hybrid</option>
  </select>
  <select id="sort" aria-label="Sort">
    <option value="new">Newest</option><option value="prize">Biggest prize</option><option value="pop">Most registered</option>
  </select>
  <button class="clear" id="clear" type="button">Reset</button>
</div>
<p class="meta" id="count" role="status"></p>
<ul class="list" id="list"></ul>
<p class="empty" id="empty" hidden>No hackathons match those filters.</p>
<footer>
  Data sourced from Devpost's public API. Last update: <span id="updated">…</span>.
  <a href="data.json">Raw JSON</a> ·
  <a href="https://discord.gg/ztAm985W3R">Feedback</a>
</footer>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
let DATA = [], state = {q:"",loc:"",theme:"",prize:"",state:"",format:"",sort:"new"};

const fmtPrize = n => n == null ? "" : "$" + n.toLocaleString("en-US");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

function passes(h, f){
  const {q,loc,theme,prize,state:st,format} = f;
  if (q && !((h.title+" "+(h.organizer||"")+" "+h.themes.join(" ")).toLowerCase().includes(q))) return false;
  if (loc && !((h.location||"").toLowerCase().includes(loc.toLowerCase()))) return false;
  if (theme && !h.themes.some(t => t.toLowerCase().includes(theme.toLowerCase()))) return false;
  if (prize !== "" && !(h.prize_amount != null && h.prize_amount >= +prize)) return false;
  if (st && h.open_state !== st) return false;
  if (format) {
    const isOnline = !!h.online, isHybrid = /\+\s*online/i.test(h.location||"");
    if (format === "online" && (!isOnline || isHybrid)) return false;
    if (format === "hybrid" && !isHybrid) return false;
    if (format === "inperson" && (isOnline && !isHybrid)) return false;
  }
  return true;
}
function facetValues(h, kind){
  return kind === "loc" ? (h.online ? [] : [h.location || ""]) : h.themes;
}
function syncHash(k, v){
  history.replaceState(null, "", v ? "#" + k + "=" + encodeURIComponent(v) : location.pathname);
}
function combobox(id, kind, anyLabel){
  const input = $(id), list = $(id + "-list");
  function render(){
    const other = {...state}; delete other[kind];
    const counts = {};
    DATA.filter(h => passes(h, other)).forEach(h =>
      facetValues(h, kind).forEach(v => counts[v] = (counts[v] || 0) + 1));
    const q = input.value.trim().toLowerCase(), sel = state[kind].trim().toLowerCase();
    const items = Object.entries(counts).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0]))
      .filter(([v]) => !q || v.toLowerCase().includes(q)).slice(0,40);
    list.innerHTML = `<li class="head" data-v="">${anyLabel}</li>` +
      items.map(([v,c]) => `<li data-v="${esc(v)}" class="${v.toLowerCase()===sel?"sel":""}"><span>${esc(v)}</span><span class="cnt">${c}</span></li>`).join("") ||
      `<li class="head">No matches</li>`;
    list.hidden = false;
  }
  input.addEventListener("focus", render);
  input.addEventListener("input", () => { state[kind] = input.value.trim(); apply(); syncHash(kind, state[kind]); render(); });
  input.addEventListener("blur", () => setTimeout(() => list.hidden = true, 150));
  list.addEventListener("mousedown", e => {
    const li = e.target.closest("li"); if (!li) return;
    e.preventDefault();
    input.value = li.dataset.v; state[kind] = li.dataset.v;
    apply(); syncHash(kind, state[kind]); list.hidden = true;
  });
}
function updateCounts(){
  const other = f => { const o = {...state}; delete o[f]; return o; };
  $("prize").querySelectorAll("option").forEach(o => {
    if (o.value === "") { o.textContent = "Any prize"; return; }
    const n = DATA.filter(h => passes(h, other("prize")) && o.value === "0"
      ? h.prize_amount != null : h.prize_amount >= +o.value).length;
    const lbl = {"0":"Cash prize offered","1000":"$1k+","10000":"$10k+","50000":"$50k+","100000":"$100k+"}[o.value];
    o.textContent = lbl + " (" + n + ")";
  });
  $("state").querySelectorAll("option").forEach(o => {
    const lbl = {"":"All","upcoming":"Accepting registrations","ongoing":"Happening now"}[o.value];
    o.textContent = o.value === "" ? lbl : lbl + " (" + DATA.filter(h => passes(h, other("state")) && h.open_state === o.value).length + ")";
  });
  $("format").querySelectorAll("option").forEach(o => {
    const lbl = {"":"Any format","online":"Online","inperson":"In person","hybrid":"Hybrid"}[o.value];
    const match = h => o.value === "online" ? (h.online && !/\+\s*online/i.test(h.location||""))
                     : o.value === "hybrid" ? /\+\s*online/i.test(h.location||"")
                     : o.value === "inperson" ? (!h.online || /\+\s*online/i.test(h.location||"")) : true;
    o.textContent = o.value === "" ? lbl : lbl + " (" + DATA.filter(h => passes(h, other("format")) && match(h)).length + ")";
  });
}
function apply(){
  const out = DATA.filter(h => passes(h, state));
  const {sort} = state;
  out.sort((a,b) => sort === "prize" ? (b.prize_amount||0)-(a.prize_amount||0)
       : sort === "pop" ? (b.registrations||0)-(a.registrations||0)
       : b.id - a.id);
  $("count").textContent = out.length + " of " + DATA.length + " hackathons";
  if (DATA.length) updateCounts();
  $("empty").hidden = out.length > 0;
  $("list").innerHTML = out.map(h => `<li>
    ${h.thumbnail ? `<img class="thumb" src="${esc(h.thumbnail)}" alt="" loading="lazy">` : ""}
    <a class="t" href="${esc(h.url)}" rel="noopener" target="_blank">${esc(h.title)}</a>
    <span class="org">— ${esc(h.organizer||"independent organizer")}</span>
    <div class="pills">
      <span class="pill">${h.online ? "🌐 Online" : "📍 " + esc(h.location)}</span>
      ${h.dates ? `<span class="pill">🗓 ${esc(h.dates)}</span>` : ""}
      ${h.prize_amount ? `<span class="pill prize">💰 ${fmtPrize(h.prize_amount)}</span>` : ""}
      <span class="pill ${h.open_state==="upcoming"?"open":"live"}">${h.open_state==="upcoming"?"✅ Registration open":"🔴 Happening now"}</span>
      ${h.invite_only ? `<span class="pill">Invite only</span>` : ""}
      <span class="pill">👥 ${(h.registrations||0).toLocaleString("en-US")}</span>
      ${h.themes.map(t => `<span class="pill">${esc(t)}</span>`).join("")}
    </div></li>`).join("");
}
["q","loc","theme","prize","state","format","sort"].forEach(k =>
  $(k).addEventListener("input", e => {
    state[k] = e.target.value; apply();
    const v = e.target.value;
    history.replaceState(null, "", v ? "#" + k + "=" + encodeURIComponent(v) : location.pathname);
  }));
$("clear").addEventListener("click", () => {
  state = {q:"",loc:"",theme:"",prize:"",state:"",format:"",sort:"new"};
  ["q","loc","theme","prize","state","format","sort"].forEach(k => $(k).value = "");
  history.replaceState(null,"",location.pathname);
  apply();
});
// restore filters from URL hash
["q","loc","theme","prize","state","format","sort"].forEach(k => {
  const m = new URLSearchParams(location.hash.slice(1)).get(k);
  if (m) { state[k] = m; $(k).value = m; }
});
function relTime(t){
  const s = (Date.now()-t)/1000;
  if (s < 3600) return Math.max(1,Math.round(s/60)) + " min ago";
  if (s < 86400) return Math.round(s/3600) + " h ago";
  return Math.round(s/86400) + " d ago (" + t.toLocaleDateString() + ")";
}
(function themeInit(){
  const saved = localStorage.getItem("hf-theme") || "system";
  const prefersDark = matchMedia("(prefers-color-scheme:dark)");
  const apply = () => {
    const t = saved === "auto" ? (prefersDark.matches ? "dark" : "light") : saved;
    document.documentElement.dataset.theme = t;
    document.querySelector('meta[name=color-scheme]').content = t;
  };
  apply();
  prefersDark.addEventListener("change", () => saved === "auto" && apply());
  const labels = {auto:"Auto", light:"Light", dark:"Dark"};
  const btn = document.getElementById("theme");
  if (btn) btn.textContent = labels[saved];
  if (btn) btn.addEventListener("click", () => {
    const order = ["auto","light","dark"];
    const next = order[(order.indexOf(saved)+1) % 3];
    localStorage.setItem("hf-theme", next);
    location.reload();
  });
})();
(typeof INLINE_DATA !== "undefined" ? Promise.resolve({json: async () => INLINE_DATA})
  : fetch("data.json")).then(r => r.json()).then(d => {
  DATA = d.hackathons || [];
  $("updated").textContent = relTime(new Date(d.updated));
  if (!DATA.length) return;
  combobox("loc", "loc", "Any location");
  combobox("theme", "theme", "Any theme");
  // noscript fallback
  const ns = $("noscript-list");
  if (ns) ns.innerHTML = DATA.slice(0,20).map(h=>`<li><a href="${esc(h.url)}">${esc(h.title)}</a> — ${esc(h.dates||"")}</li>`).join("");
  apply();
  // SEO: expose ItemList
  const ld = document.createElement("script");
  ld.type = "application/ld+json";
  ld.textContent = JSON.stringify({"@context":"https://schema.org","@type":"ItemList",
    itemListElement: DATA.slice(0,50).map((h,i)=>({"@type":"ListItem","position":i+1,
      "item":{"@type":"Event","name":h.title,"url":h.url,"eventStatus":"https://schema.org/EventScheduled",
      "eventAttendanceMode":"https://schema.org/OnlineEventAttendanceMode",
      "organizer":{"@type":"Organization","name":h.organizer||""},
      ...(h.dates?{}:{}), "description":"Hackathon"+(h.themes.length?" — "+h.themes.join(", "):"")}}))});
  document.head.appendChild(ld);
}).catch(e => { $("count").textContent = "Failed to load data: " + e; });
</script>
</body>
